<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}}; script-src 'nonce-{{nonce}}'; font-src {{cspSource}};"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title>AI Usage</title>
  </head>
  <body>
    <header class="toolbar">
      <span class="toolbar-title">AI 用量</span>
      <div class="toolbar-actions">
        <button id="refresh-all" class="btn btn-primary" type="button">
          <span class="spinner" hidden></span>
          <span class="btn-label">重新整理全部</span>
        </button>
      </div>
    </header>

    <p class="manual-note">
      本面板<strong>不會自動更新</strong>，只有你按下重新整理時才會讀取。
      <a href="#" data-action="show-logs">檢視記錄</a>
    </p>

    <main id="cards" class="cards"></main>

    <footer class="footer">
      <span id="footer-note">尚未取得任何資料，請按「重新整理全部」。</span>
    </footer>

    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
