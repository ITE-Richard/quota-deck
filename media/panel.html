<!DOCTYPE html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}}; script-src 'nonce-{{nonce}}'; font-src {{cspSource}};"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title>Quota Deck</title>
  </head>
  <body>
    <header class="toolbar">
      <span id="toolbar-title" class="toolbar-title"></span>
      <div class="toolbar-actions">
        <button id="refresh-all" class="btn btn-primary" type="button">
          <span class="spinner" hidden></span>
          <span id="refresh-all-label" class="btn-label"></span>
        </button>
      </div>
    </header>

    <p class="manual-note">
      <span id="manual-note-text"></span>
      <a href="#" id="show-logs-link" data-action="show-logs"></a>
    </p>

    <main id="cards" class="cards"></main>

    <footer class="footer">
      <span id="footer-note"></span>
    </footer>

    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
